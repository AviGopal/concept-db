name: CI

on:
  push:
    branches:
      - dev
      - feature/*
      - bugfix/*
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        continue-on-error: true
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun test

      - name: Lint (includes shape-dispatch agreement check)
        run: bun run lint
